
name: Git_secrets

on:
  push:
    branches:
      - main

jobs:
  use-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: prints a message containing the  literal text 
        run: echo "The secret is \${{ secrets.SECRET }}"

      - name: prints a message containing the raw secret
        run: echo "The secret is ${{ secrets.SECRET }}"

